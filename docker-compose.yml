services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: api_ficha
      DB_USERNAME: root
      DB_PASSWORD: 1234
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: sh -c "composer install && php artisan serve --host=0.0.0.0 --port=8000"
    networks:
      - red_api
  db: 
    image: mysql:latest
    container_name: mysql_container
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=api_ficha
    ports:
      - "3307:3306"
    networks:
      - red_api
    volumes:
      - mysql_data_api:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin_container
    environment:
      - PMA_HOST=db 
    ports:
      - "8081:80"
    networks:
      - red_api
volumes:
  mysql_data_api:
networks:
  red_api:
    driver: bridge
